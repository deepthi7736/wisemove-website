<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiseMove Admin — Enquiries</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">
    <div>
      <h1>WiseMove Admin</h1>
      <p>Enquiry Management</p>
    </div>

    <button id="refreshBtn" class="btn btn-primary">
      Refresh
    </button>
  </header>

  <main class="admin-container">

    <section class="stats">
      <div class="stat-card">
        <span>Total Enquiries</span>
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat-card">
        <span>New</span>
        <strong id="newCount">0</strong>
      </div>

      <div class="stat-card">
        <span>Contacted</span>
        <strong id="contactedCount">0</strong>
      </div>
    </section>

    <section class="toolbar">

      <input
        type="text"
        id="searchInput"
        placeholder="Search enquiries..."
      >

      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="New">New</option>
        <option value="Contacted">Contacted</option>
        <option value="Closed">Closed</option>
      </select>

      <button id="addBtn" class="btn btn-primary">
        + Add Enquiry
      </button>

    </section>

    <section class="table-card">

      <div id="loading" class="message">
        Loading enquiries...
      </div>

      <div id="error" class="message error" hidden></div>

      <table id="enquiryTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Company</th>
            <th>Phone</th>
            <th>Message</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="enquiryBody"></tbody>
      </table>

      <div id="emptyState" class="empty" hidden>
        No enquiries found.
      </div>

    </section>

  </main>

  <!-- Enquiry Modal -->

  <div id="modal" class="modal" hidden>

    <div class="modal-box">

      <div class="modal-header">
        <h2 id="modalTitle">Add Enquiry</h2>

        <button id="closeModal" class="close-btn">
          ×
        </button>
      </div>

      <form id="enquiryForm">

        <input type="hidden" id="enquiryId">

        <div class="form-grid">

          <div class="field">
            <label>Name *</label>
            <input id="name" required>
          </div>

          <div class="field">
            <label>Email *</label>
            <input id="email" type="email" required>
          </div>

          <div class="field">
            <label>Company</label>
            <input id="company">
          </div>

          <div class="field">
            <label>Phone</label>
            <input id="phone">
          </div>

          <div class="field full">
            <label>Message *</label>
            <textarea id="message" rows="5" required></textarea>
          </div>

          <div class="field">
            <label>Status</label>

            <select id="status">
              <option value="New">New</option>
              <option value="Contacted">Contacted</option>
              <option value="Closed">Closed</option>
            </select>

          </div>

        </div>

        <div class="modal-actions">

          <button type="button" id="cancelBtn" class="btn btn-secondary">
            Cancel
          </button>

          <button type="submit" class="btn btn-primary">
            Save Enquiry
          </button>

        </div>

      </form>

    </div>

  </div>

  <script src="admin.js"></script>

</body>
</html>
